name: Refresh Observatory

on:
  schedule:
    - cron: '17 6,17 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: observatory-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test feed handling
        run: python -m unittest discover -s observatory/tests -v
      - name: Collect source feeds
        run: python observatory/scripts/collect.py
      - name: Save edition
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add observatory/data/edition.json observatory/feed.xml
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh Observatory edition'
            git pull --rebase origin main
            git push
          fi
      - name: Request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
